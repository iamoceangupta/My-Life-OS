VIEWS.tasks = {
  title: 'Tasks', icon: 'tasks',
  render(el) {
    const list = ui('taskList', 'today'), view = ui('taskView', 'list');
    const f = ui('taskFilter', { q: '', prio: '', cat: '', tag: '', status: '', sort: 'due' });
    const lists = [['today', 'Today', T.today().length + T.overdue().length], ['upcoming', 'Upcoming', T.upcoming().length], ['overdue', 'Overdue', T.overdue().length], ['important', 'Important', T.important().length], ['completed', 'Completed', T.completed().length], ['all', 'All', S.data.tasks.length]];
    const tags = [...new Set(S.data.tasks.flatMap(t => t.tags || []))].sort();
    const cats = [...new Set([...S.settings.taskCats, ...S.data.tasks.map(t => t.category).filter(Boolean)])];
    el.innerHTML = `<div class="page-head"><div><h2>Tasks</h2><p>${T.open().length} open · ${T.completed().filter(t => D.ym(T.completedOn(t) || '') === D.ym(D.today())).length} completed this month</p></div><span class="spacer"></span>
      <div class="tabs">${[['list', 'list', 'List'], ['board', 'board', 'Board'], ['calendar', 'calendar', 'Calendar']].map(([k, i, l]) => `<button class="${view === k ? 'on' : ''}" data-view="${k}">${ic(i)}<span class="hide-sm">${l}</span></button>`).join('')}</div>
      <button class="btn primary" data-new>${ic('plus')} New task</button></div>
      ${view === 'list' ? `<div class="toolbar"><div class="tabs">${lists.map(([k, l, n]) => `<button class="${list === k ? 'on' : ''}" data-list="${k}">${l} <span class="cnt">${n}</span></button>`).join('')}</div></div>` : ''}
      <div class="toolbar"><div class="search-inp">${ic('search')}<input class="input sm" id="tk-q" placeholder="Search tasks…" value="${esc(f.q)}"></div>
        <select class="input sm" id="tk-prio"><option value="">Any priority</option>${PRIORITIES.map(p => `<option ${f.prio === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
        <select class="input sm" id="tk-cat"><option value="">Any category</option>${cats.map(c => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        ${tags.length ? `<select class="input sm" id="tk-tag"><option value="">Any tag</option>${tags.map(c => `<option ${f.tag === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>` : ''}
        ${view === 'list' ? `<select class="input sm" id="tk-status"><option value="">Any status</option>${STATUSES.map(c => `<option ${f.status === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
        <select class="input sm" id="tk-sort">${[['due', 'Sort: Due date'], ['priority', 'Sort: Priority'], ['created', 'Sort: Newest'], ['title', 'Sort: A–Z']].map(([k, l]) => `<option value="${k}" ${f.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}
        ${f.q || f.prio || f.cat || f.tag || f.status ? `<button class="btn sm ghost" data-clear>${ic('x')} Clear filters</button>` : ''}</div>
      <div id="tk-body"></div>`;
    el.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { setUI('taskView', b.dataset.view); refresh(); });
    el.querySelectorAll('[data-list]').forEach(b => b.onclick = () => { setUI('taskList', b.dataset.list); refresh(); });
    el.querySelector('[data-new]').onclick = () => openTask(null, list === 'today' ? { due: D.today() } : list === 'important' ? { important: true } : {});
    const c = el.querySelector('[data-clear]'); if (c) c.onclick = () => { setUI('taskFilter', { q: '', prio: '', cat: '', tag: '', status: '', sort: f.sort }); refresh(); };
    const applyF = l => l.filter(t => (!f.prio || t.priority === f.prio) && (!f.cat || t.category === f.cat) && (!f.tag || (t.tags || []).includes(f.tag)) && (!f.status || t.status === f.status) && (!f.q || [t.title, t.desc, (t.tags || []).join(' '), t.category, (t.subtasks || []).map(s => s.text).join(' ')].join(' ').toLowerCase().includes(f.q.toLowerCase())));
    const body = $('#tk-body', el);
    const draw = () => {
      if (view === 'board') return taskBoard(body, applyF(S.data.tasks));
      if (view === 'calendar') return taskCalendar(body, applyF(S.data.tasks));
      const base = { today: [...T.overdue(), ...T.today()], upcoming: T.upcoming(), overdue: T.overdue(), important: T.important(), completed: T.completed(), all: S.data.tasks }[list];
      let l = T.sort(applyF(base), f.sort);
      if (list === 'completed') l = [...l].sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
      taskList(body, l, list, f.sort);
    };
    const upd = () => { setUI('taskFilter', f); draw(); };
    $('#tk-q', el).oninput = debounce(e => { f.q = e.target.value; upd(); }, 150);
    [['tk-prio', 'prio'], ['tk-cat', 'cat'], ['tk-tag', 'tag'], ['tk-status', 'status'], ['tk-sort', 'sort']].forEach(([id, k]) => { const s = $('#' + id, el); if (s) s.onchange = e => { f[k] = e.target.value; setUI('taskFilter', f); refresh(); }; });
    draw();
  },
};
function taskRowHTML(t) {

  return `<div class="task-row ${T.done(t) ? 'done' : ''}" data-task="${t.id}"><span class="prio prio-${t.priority || 'Low'}" title="${esc(t.priority)} priority"></span>
    <button class="check round ${T.done(t) ? 'on' : ''}" data-tcheck="${t.id}" aria-label="Toggle complete">${ic('check')}</button>
    <div class="t" data-topen="${t.id}"><div class="title">${esc(t.title)}</div><div class="meta">${T.dueLabel(t)}${t.status === 'In Progress' ? '<span class="pill info" style="height:18px">In progress</span>' : t.status === 'On Hold' ? '<span class="pill warn" style="height:18px">On hold</span>' : ''}${t.category ? `<span>${esc(t.category)}</span>` : ''}${t.recur && t.recur !== 'none' ? `<span title="Repeats ${t.recur}">${ic('repeat')} ${t.recur}</span>` : ''}${goal ? `<span>${ic('target')} ${esc(goal.title)}</span>` : ''}${(t.tags || []).map(x => `<span class="tag">#${esc(x)}</span>`).join('')}${t.remind !== '' && t.remind != null && t.due ? `<span title="Reminder set">${ic('bell')}</span>` : ''}</div></div>
    ${subs.length ? `<button class="btn ghost sm" data-subs="${t.id}" title="Subtasks">${ic('checklist')} ${sd}/${subs.length}</button>` : ''}
    <button class="btn ghost icon sm" data-star="${t.id}" aria-label="Toggle important" style="color:${t.important ? 'var(--warn)' : 'var(--faint)'}">${ic('star')}</button>
    <span class="hide-sm">${prioPill(t.priority)}</span></div>

      <div class="row nowrap" style="gap:18px">${ring(p, p >= 100 ? 'var(--good)' : 'var(--accent)', 84)}<div style="min-width:0">${g.desc ? `<p>${esc(g.desc)}</p>` : '<p class="muted">No description.</p>'}<p class="muted" style="font-size:12px;margin-top:6px">${g.mode === 'manual' ? 'Progress set manually' : 'Progress = completed milestones + linked tasks'}</p></div></div>

      <div><b>Updates & notes</b><form data-upd class="stack" style="gap:6px;margin:8px 0"><textarea class="input" rows="2" id="upd-new" placeholder="What progress did you make? Any blockers?"></textarea><button class="btn sm" style="align-self:flex-end">Post update</button></form>${(g.updates || []).slice().reverse().map(u => `<div style="border-left:2px solid var(--border-strong);padding:2px 0 8px 12px"><div class="muted" style="font-size:11.5px">${D.fmt(u.date)}</div><div style="white-space:pre-wrap">${esc(u.text)}</div></div>`).join('')}</div>`;
    el.querySelectorAll('[data-ms]').forEach(b => b.onclick = async () => { const x = g.milestones.find(y => y.id === b.dataset.ms); x.done = !x.done; await save('goals', g); draw(el, m); });
    el.querySelectorAll('[data-msdel]').forEach(b => b.onclick = async () => { g.milestones = g.milestones.filter(y => y.id !== b.dataset.msdel); await save('goals', g); draw(el, m); });
    el.querySelector('[data-msadd]').onsubmit = async e => { e.preventDefault(); const v = $('#ms-new', el).value.trim(); if (!v) return; g.milestones = g.milestones || []; g.milestones.push({ id: uid(), text: v, done: false }); await save('goals', g); draw(el, m); setTimeout(() => $('#ms-new', el).focus(), 20); };
    el.querySelector('[data-upd]').onsubmit = async e => { e.preventDefault(); const v = $('#upd-new', el).value.trim(); if (!v) return; g.updates = g.updates || []; g.updates.push({ date: D.today(), text: v }); await save('goals', g); draw(el, m); toast('Update posted'); };
    el.querySelector('[data-addtask]').onclick = () => openTask(null, { goalId: g.id, category: S.settings.taskCats.includes(g.category) ? g.category : S.settings.taskCats[0] });
    el.querySelectorAll('[data-tcheck]').forEach(b => b.onclick = async () => { await T.toggle(byId('tasks', b.dataset.tcheck)); draw(el, m); });
    el.querySelectorAll('[data-topen]').forEach(b => b.onclick = () => openTask(byId('tasks', b.dataset.topen)));
    const cb = el.querySelector('[data-complete]'); cb.textContent = G.done(g) ? 'Reopen goal' : 'Mark complete';
  };
  openModal({
    title: g.title, size: 'lg',
    footer: `<button class="btn danger" data-gdel style="margin-right:auto">${ic('trash')}</button><button class="btn" data-gedit>${ic('edit')} Edit</button><button class="btn primary" data-complete>Mark complete</button>`,
    onMount: (el, m) => {
      draw(el, m);
      const unsub = () => { const i = refreshHooks.indexOf(hook); if (i >= 0) refreshHooks.splice(i, 1); };
      const hook = () => { if (document.body.contains(el)) draw(el, m); else unsub(); };
      refreshHooks.push(hook);
      el.querySelector('[data-gedit]').onclick = () => openGoal(g);

    },
  });
}

function exportBackup() {
  const data = {}; STORES.filter(s => s !== 'meta').forEach(s => data[s] = S.data[s]);
  const settings = clone(S.settings); delete settings.notified;
  const json = JSON.stringify({ app: 'my-life-os', version: 1, exportedAt: new Date().toISOString(), settings, data }, null, 1);
  S.settings.lastBackup = Date.now(); saveSettings();
  exportModal('Full backup', `my-life-os-backup-${D.today()}.json`, json, 'application/json');
}
function restoreBackup() {
  openModal({
    title: 'Restore from backup', size: 'lg',
    body: `<p class="muted">Choose a backup file exported from My Life OS, or paste its contents.</p><input type="file" accept=".json,application/json" id="rs-file" class="input" style="padding:6px"><textarea class="input code-out" id="rs-text" placeholder="…or paste backup JSON here" style="min-height:140px"></textarea><div class="field"><label>How to restore</label><div class="seg" id="rs-mode"><button class="on" data-v="merge">Merge with current data</button><button data-v="replace">Replace everything</button></div><div class="hint">Merge keeps your current records and adds or updates ones from the backup. Replace deletes current data first.</div></div><div class="errmsg" id="rs-err" hidden></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Restore</button>`,
    onMount: (el, m) => {
      let mode = 'merge';
      el.querySelectorAll('#rs-mode button').forEach(b => b.onclick = () => { mode = b.dataset.v; el.querySelectorAll('#rs-mode button').forEach(x => x.classList.toggle('on', x === b)); });
      $('#rs-file', el).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#rs-text', el).value = r.result; }; r.readAsText(f); };
      el.querySelector('[data-go]').onclick = async () => {
        const err = $('#rs-err', el); err.hidden = true;
        let obj; try { obj = JSON.parse($('#rs-text', el).value); } catch { err.textContent = "That isn't valid JSON. Choose the file again or paste the full backup."; err.hidden = false; return; }
        if (!obj || obj.app !== 'my-life-os' || !obj.data) { err.textContent = "This doesn't look like a My Life OS backup."; err.hidden = false; return; }
        if (mode === 'replace' && !(await confirmBox({ title: 'Replace all data?', message: 'Everything currently saved will be deleted and replaced with the backup.', okText: 'Replace' }))) return;
        try {
          await Sync.whenIdle();
          for (const s of STORES.filter(x => x !== 'meta')) {
            // Restored records count as fresh edits (new updatedAt), so they win over older cloud copies when synced.
            const arr = (Array.isArray(obj.data[s]) ? obj.data[s].filter(x => x && x.id) : []).map(x => ({ ...x, updatedAt: nextTs(x.updatedAt) }));
            if (mode === 'replace') {
              const keep = new Set(arr.map(x => x.id));
              const gone = S.data[s].filter(x => !keep.has(x.id));
              await DB.clear(s); S.data[s] = [];
              for (const r of gone) await Sync.track(s, r.id, 'del', r);   // tombstones for records the backup doesn't have
            }
            if (arr.length) { await DB.putMany(s, arr); for (const r of arr) await Sync.track(s, r.id, 'put'); }
            const map = new Map(S.data[s].map(x => [x.id, x])); arr.forEach(x => map.set(x.id, x)); S.data[s] = [...map.values()];
          }
          if (obj.settings) { S.settings = Object.assign(clone(DEFAULT_SETTINGS), mode === 'merge' ? S.settings : {}, obj.settings, { id: 'settings', notified: S.settings.notified || {}, onboarded: true }); await saveSettings(); }
          for (const k in fmtCache) delete fmtCache[k];
          m.close(); applyTheme(); applyShell(); refresh(); toast('Backup restored');
        } catch (e) { console.error(e); err.textContent = 'Restore failed while writing to storage.'; err.hidden = false; }
      };
    },
  });
}
function eraseAll() {
  const signedIn = !!Sync.user;
  openModal({
    title: 'Erase all data?', size: 'sm',
    body: `<p class="muted">This deletes every transaction, task, habit, goal, note, journal entry, event, list and setting${signedIn ? '' : ' in this browser'}. Export a backup first if you might need it.</p>
      ${signedIn ? `<div class="field"><label>What to erase</label><div class="seg" id="er-scope"><button class="on" data-v="device">This device only</button><button data-v="cloud">This device and the cloud</button></div><div class="hint" id="er-hint"></div></div>` : ''}
      <div class="field"><label for="er-c">Type DELETE to confirm</label><input class="input" id="er-c" autocomplete="off"></div><div class="errmsg" id="er-err" hidden></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn danger solid" data-er disabled>Erase everything</button>`,
    onMount: (el, m) => {
      const b = el.querySelector('[data-er]');
      let scope = 'device';
      const hint = () => { const h = $('#er-hint', el); if (h) h.textContent = scope === 'device' ? 'Your cloud copy is kept. This device is signed out of cloud sync, so the data isn\'t downloaded again straight away.' : 'Deletes the cloud copy too. Your other devices remove the data the next time they sync.'; };
      el.querySelectorAll('#er-scope button').forEach(x => x.onclick = () => { scope = x.dataset.v; el.querySelectorAll('#er-scope button').forEach(y => y.classList.toggle('on', y === x)); hint(); });
      hint();
      $('#er-c', el).oninput = e => b.disabled = e.target.value.trim() !== 'DELETE';
      b.onclick = async () => {
        b.disabled = true;
        await Sync.whenIdle();
        if (signedIn && scope === 'cloud') {
          // Cloud first: if this fails, nothing local is touched.
          try { await Sync.eraseCloud(); }
          catch (e) { const er = $('#er-err', el); er.textContent = 'Could not erase the cloud copy: ' + Sync.describeError(e) + '. Nothing was deleted.'; er.hidden = false; b.disabled = false; return; }
        }
        if (scope === 'device') { if (signedIn) await Sync.signOut({ quiet: true }); Sync.forgetDevice(); }
        for (const s of [...STORES, 'outbox']) { await DB.clear(s); if (S.data[s]) S.data[s] = []; }
        const keepDevice = Sync.deviceFields(S.settings);
        S.settings = Object.assign(clone(DEFAULT_SETTINGS), { sidebarCollapsed: keepDevice.sidebarCollapsed });
        Sync.settingsBaseline(true);   // treat the fresh defaults as a new change, so they sync
        lsSet('listsSeeded', false); await saveSettings(); await ensureDefaultLists();
        m.close(); applyTheme(); applyShell(); go('home'); refresh();
        toast(signedIn && scope === 'cloud' ? 'All data erased on this device and in the cloud' : 'All data erased on this device');
        if (signedIn && scope === 'cloud') Sync.request('erase');
      };
    },
  });
}

/* ============================================================
   Cloud sync (Supabase) — optional, offline-first
   ------------------------------------------------------------
   IndexedDB stays the primary store; Supabase keeps a copy in ONE table:
     public.records(user_id, store, id, data jsonb, updated_at bigint,
                    deleted bool, server_updated_at timestamptz)
   • Local writes: save() / removeItem() / bulk paths call Sync.track(),
     which writes {store, id, op} to the IndexedDB "outbox" store
     (one entry per record; a later change replaces an earlier one).
   • Push: outbox → upsert, ≤500 rows per request. An entry is cleared only
     after the server answered, and only if it wasn't changed meanwhile.
     Deletes are pushed as tombstones (deleted = true).
   • Pull: rows with server_updated_at after the cursor (minus a 60 s overlap),
     paged, applied with last-write-wins on updated_at. Applying remote rows
     never writes to the outbox, so nothing echoes back.
   • The server trigger also refuses updates that carry an older updated_at;
     push detects those rows and pulls the newer version instead.
   • Config (URL, anon key, toggles) lives in localStorage only, never in records.
   ============================================================ */
const SUPABASE_JS = {
  src: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js',
  integrity: 'sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O',
};
const SYNC_DEVICE_FIELDS = ['notified', 'sidebarCollapsed', 'lastBackup'];   // never leave this device
const SYNC_BATCH = 500, SYNC_PAGE = 1000, SYNC_OVERLAP_MS = 60000, SYNC_POLL_MS = 60000;
const SYNC_AUTH_KEY = 'lifeos:sb-auth';   // where supabase-js keeps the session (tokens, never the password)

const Sync = {
  client: null, user: null, state: 'off', error: '', lastAt: null, pendingCount: 0,
  busy: false, again: false, idleWaiters: [], seq: 0, failures: 0, lastToast: '', lastRun: 0,
  retryTimer: null, debounceTimer: null, pollTimer: null, libPromise: null, deferredRefresh: false, wired: false, _sig: undefined,

  /* ---------- config (localStorage only) ---------- */
  cfg() { return Object.assign({ url: '', key: '', auto: true, demo: false }, lsGet('sync:cfg', {})); },
  setCfg(p) { lsSet('sync:cfg', Object.assign(Sync.cfg(), p)); },
  configured() { const c = Sync.cfg(); return !!(c.url && c.key); },
  uidKey(k) { return `sync:${k}:${Sync.user ? Sync.user.id : ''}`; },
  forgetDevice() {   // the next sign-in on this device is treated as a first sign-in again
    try { Object.keys(localStorage).filter(k => /^lifeos:sync:(init|cursor|lastAt):/.test(k)).forEach(k => localStorage.removeItem(k)); } catch { }
  },
  clearSession() { try { Object.keys(localStorage).filter(k => k.startsWith(SYNC_AUTH_KEY)).forEach(k => localStorage.removeItem(k)); } catch { } },

  /* ---------- settings record: everything except device-only fields ---------- */
  deviceFields(st) { const o = {}; SYNC_DEVICE_FIELDS.forEach(k => { if (st && k in st) o[k] = st[k]; }); return o; },
  settingsPayload() { const o = clone(S.settings); SYNC_DEVICE_FIELDS.forEach(k => delete o[k]); o.id = 'settings'; return o; },
  settingsSig() { const o = Sync.settingsPayload(); delete o.updatedAt; return JSON.stringify(o); },
  settingsBaseline(dirty) { Sync._sig = dirty ? null : Sync.settingsSig(); },
  settingsChanged() { const s = Sync.settingsSig(); if (s === Sync._sig) return false; Sync._sig = s; return true; },

  /* ---------- outbox ---------- */
  nextSeq() { return (Sync.seq = Math.max(Sync.seq + 1, Date.now() * 1000)); },
  entry(store, id, op, rec) {
    const e = { key: store + '|' + id, store, id, op, seq: Sync.nextSeq() };
    if (op === 'del') { e.ts = nextTs(rec && rec.updatedAt); if (rec && rec.demo) e.demo = true; }
    return e;
  },
  // Hook called by save(), removeItem() and the bulk paths. Never called when applying remote rows.
  async track(store, id, op, rec) {
    if (!DB.db) return;
    try { await DB.put('outbox', Sync.entry(store, id, op, rec)); } catch (e) { console.error(e); }
    Sync.pendingSoon(); Sync.schedule();
  },
  async enqueueAll() {
    const es = [];
    STORES.forEach(s => { if (s !== 'meta') S.data[s].forEach(r => es.push(Sync.entry(s, r.id, 'put'))); });
    es.push(Sync.entry('meta', 'settings', 'put'));
    await DB.putMany('outbox', es);
  },
  // Remove outbox entries, but only if a newer local change hasn't replaced them in the meantime.
  clearOutbox(entries) {
    if (!entries.length) return Promise.resolve();
    return DB.tx('outbox', 'readwrite', os => { entries.forEach(e => { const r = os.get(e.key); r.onsuccess = () => { if (r.result && r.result.seq === e.seq) os.delete(e.key); }; }); });
  },
  pendingSoon: debounce(() => Sync.updatePending(), 300),
  async updatePending() { if (!DB.db) return; try { Sync.pendingCount = await DB.tx('outbox', 'readonly', os => os.count()) || 0; } catch { } Sync.paint(); },

  /* ---------- local <-> cloud shapes ---------- */
  localRecord(store, id) { return store === 'meta' ? (id === 'settings' ? Sync.settingsPayload() : null) : byId(store, id); },
  toCloud(store, rec) {
    if (store === 'lists' && !Sync.cfg().demo && (rec.items || []).some(i => i && i.demo)) return { ...rec, items: rec.items.filter(i => !(i && i.demo)) };
    return rec;
  },
  // supabase-js returns {data, error}; turn errors into exceptions that carry the code and HTTP status
  async q(builder) {
    const res = await builder;
    if (res.error) { const e = new Error(res.error.message || 'Request failed'); e.code = res.error.code; e.status = res.status; e.details = res.error.details; throw e; }
    return res;
  },

  /* ---------- push ---------- */
  async push() {
    const c = Sync.cfg(), uid = Sync.user.id;
    const entries = await DB.all('outbox');
    if (!entries.length) return false;
    const rows = [], sent = [], skipped = [];
    for (const e of entries) {
      if (!STORES.includes(e.store)) { skipped.push(e); continue; }
      if (e.op === 'del') {
        if (e.demo && !c.demo) { skipped.push(e); continue; }
        rows.push({ user_id: uid, store: e.store, id: String(e.id), data: {}, updated_at: Math.round(e.ts || Date.now()), deleted: true });
      } else {
        const rec = Sync.localRecord(e.store, e.id);
        if (!rec || (rec.demo && !c.demo)) { skipped.push(e); continue; }
        rows.push({ user_id: uid, store: e.store, id: String(e.id), data: Sync.toCloud(e.store, rec), updated_at: Math.round(Number(rec.updatedAt) || 0), deleted: false });
      }
      sent.push(e);
    }
    const rejected = [];
    for (let i = 0; i < rows.length; i += SYNC_BATCH) {
      const batch = rows.slice(i, i + SYNC_BATCH);
      const { data } = await Sync.q(Sync.client.from('records').upsert(batch, { onConflict: 'user_id,store,id' }).select('store,id'));
      const ok = new Set((data || []).map(r => r.store + '|' + r.id));
      batch.forEach(r => { if (!ok.has(r.store + '|' + r.id)) rejected.push(r); });   // the server kept a newer version
      await Sync.clearOutbox(sent.slice(i, i + SYNC_BATCH));
    }
    await Sync.clearOutbox(skipped);
    return rejected.length ? Sync.fetchAndApply(rejected) : false;
  },

  /* ---------- pull ---------- */
  async pull(full) {
    const ck = Sync.uidKey('cursor');
    const cursor = full ? null : lsGet(ck, null);
    const since = cursor ? new Date(Date.parse(cursor) - SYNC_OVERLAP_MS).toISOString() : null;
    let from = 0, maxT = cursor, changed = false;
    for (; ;) {
      let q = Sync.client.from('records').select('store,id,data,updated_at,deleted,server_updated_at').eq('user_id', Sync.user.id);
      if (since) q = q.gt('server_updated_at', since);
      q = q.order('server_updated_at', { ascending: true }).order('store').order('id').range(from, from + SYNC_PAGE - 1);
      const rows = (await Sync.q(q)).data || [];
      if (rows.length) {
        if (await Sync.applyRows(rows)) changed = true;
        rows.forEach(r => { if (!maxT || Date.parse(r.server_updated_at) > Date.parse(maxT)) maxT = r.server_updated_at; });
      }
      if (rows.length < SYNC_PAGE) break;
      from += SYNC_PAGE;
    }
    if (maxT) lsSet(ck, maxT);
    return changed;
  },
  async fetchAndApply(rows) {
    const byStore = groupBy(rows, r => r.store); let changed = false;
    for (const s in byStore) {
      const ids = byStore[s].map(r => r.id);
      for (let i = 0; i < ids.length; i += 100) {
        const { data } = await Sync.q(Sync.client.from('records').select('store,id,data,updated_at,deleted,server_updated_at').eq('user_id', Sync.user.id).eq('store', s).in('id', ids.slice(i, i + 100)));
        if (await Sync.applyRows(data || [])) changed = true;
      }
    }
    return changed;
  },
  // Apply remote rows with last-write-wins. Writes IndexedDB directly (not via save/removeItem),
  // so remote changes are never queued again.
  async applyRows(rows) {
    const demoOff = !Sync.cfg().demo;
    const pend = new Map((await DB.all('outbox')).map(e => [e.key, e]));
    const puts = {}, dels = {}, drop = []; let changed = false, settingsRow = null;
    for (const r of rows) {
      if (!STORES.includes(r.store)) continue;          // unknown store (newer app version): ignore
      const key = r.store + '|' + r.id, p = pend.get(key), ts = Number(r.updated_at) || 0;
      if (r.store === 'meta') {
        if (r.id === 'settings' && ts > (Number(S.settings.updatedAt) || 0)) { settingsRow = r; if (p) drop.push(p); }
        continue;
      }
      const local = byId(r.store, r.id);
      const localTs = local ? (Number(local.updatedAt) || 0) : (p && p.op === 'del' ? p.ts : -1);
      if (ts <= localTs) continue;                       // our copy is the same or newer
      if (p) drop.push(p);                               // remote is newer: forget the stale local change
      if (r.deleted) {
        if (local) { S.data[r.store] = S.data[r.store].filter(x => x.id !== r.id); (dels[r.store] = dels[r.store] || []).push(r.id); changed = true; }
      } else {
        const data = Object.assign({}, r.data, { id: r.id, updatedAt: ts });
        if (r.store === 'lists' && demoOff && local && Array.isArray(local.items)) {   // keep this device's demo items
          const demo = local.items.filter(i => i && i.demo);
          if (demo.length) data.items = [...(data.items || []).filter(i => !(i && i.demo)), ...demo];
        }
        const arr = S.data[r.store], i = arr.findIndex(x => x.id === r.id);
        if (i >= 0) arr[i] = data; else arr.push(data);
        (puts[r.store] = puts[r.store] || []).push(data); changed = true;
      }
    }
    const writes = [];
    if (settingsRow) { Sync.applySettings(settingsRow); writes.push(DB.put('meta', S.settings)); changed = true; }
    // Start every transaction synchronously, so a local edit made meanwhile is always written after these.
    for (const s in puts) writes.push(DB.putMany(s, puts[s]));
    for (const s in dels) writes.push(DB.delMany(s, dels[s]));
    if (drop.length) writes.push(Sync.clearOutbox(drop));
    await Promise.all(writes);
    return changed;
  },
  applySettings(r) {
    const dev = Sync.deviceFields(S.settings);
    S.settings = Object.assign(clone(DEFAULT_SETTINGS), r.deleted ? {} : (r.data || {}), dev, { id: 'settings', updatedAt: Number(r.updated_at) || 0 });
    DEFAULT_WIDGETS.forEach(id => { if (!S.settings.widgets.find(w => w.id === id)) S.settings.widgets.push({ id, on: true }); });
    Sync.settingsBaseline();
    for (const k in fmtCache) delete fmtCache[k];
    applyTheme(); applyShell();
  },

  /* ---------- first sign-in on this device ---------- */
  localHasData() { return STORES.some(s => s !== 'meta' && S.data[s].some(x => !(s === 'lists' && !(x.items || []).length))); },
  async firstSync() {
    Sync.setState('syncing');
    const head = await Sync.q(Sync.client.from('records').select('id', { count: 'exact', head: true }).eq('user_id', Sync.user.id).eq('deleted', false));
    const cloudHas = (head.count || 0) > 0, localHas = Sync.localHasData();
    let mode;
    if (!localHas) mode = cloudHas ? 'replace' : 'merge';
    else if (!cloudHas) mode = 'upload';
    else {
      Sync.setState('choose');
      mode = await choiceBox({
        title: 'Set up sync on this device',
        message: `Your cloud account (${Sync.user.email}) already has data, and so does this device. How should they be combined?`,
        choices: [
          { value: 'merge', label: 'Merge (newest wins)', hint: 'Keep everything from both. If the same item was changed in both places, the most recent edit wins.' },
          { value: 'upload', label: "Upload this device's data", hint: 'Make the cloud match this device. Cloud items that are not on this device are deleted.' },
          { value: 'replace', label: 'Replace with cloud data', hint: "Make this device match the cloud. This device's own data is discarded.", danger: true },
        ],
      });
      if (mode === 'replace' && !(await confirmBox({ title: "Discard this device's data?", message: 'Everything on this device is replaced with your cloud data. Export a backup first if you might need it.', okText: 'Replace with cloud' }))) mode = null;
      if (!mode) return 'cancel';
      Sync.setState('syncing');
    }
    const changed = mode === 'replace' ? await Sync.initReplace() : mode === 'upload' ? await Sync.initUpload() : await Sync.initMerge();
    lsSet(Sync.uidKey('init'), true);
    if (localHas || cloudHas) toast({ replace: 'This device now has your cloud data', upload: cloudHas ? 'The cloud now matches this device' : "This device's data was uploaded to the cloud", merge: 'Merged this device with your cloud data' }[mode]);
    return changed;
  },
  async initMerge() {
    await Sync.enqueueAll();
    let changed = await Sync.pull(true);
    if (await Sync.dedupeDefaultLists()) changed = true;
    if (await Sync.push()) changed = true;
    return changed;
  },
  // Each device creates the built-in lists on first run, so merging two devices could show them twice.
  // Keep one per kind, and remove duplicates that are still empty and still have their default name.
  async dedupeDefaultLists() {
    let removed = false;
    const byKind = groupBy(S.data.lists.filter(l => l.kind && l.kind !== 'custom' && LIST_KINDS[l.kind]), l => l.kind);
    for (const k in byKind) {
      const ls = byKind[k]; if (ls.length < 2) continue;
      const keep = ls.slice().sort((a, b) => ((b.items || []).length - (a.items || []).length) || ((a.createdAt || 0) - (b.createdAt || 0)))[0];
      for (const l of ls) if (l !== keep && !(l.items || []).length && l.name === LIST_KINDS[k].label) { await removeItem('lists', l.id, { silent: true }); removed = true; }
    }
    return removed;
  },
  async initReplace() {
    for (const s of [...STORES, 'outbox']) await DB.clear(s);
    STORES.forEach(s => { S.data[s] = []; });
    S.settings = Object.assign(clone(DEFAULT_SETTINGS), Sync.deviceFields(S.settings), { updatedAt: 0 });
    Sync.settingsBaseline();
    await DB.put('meta', S.settings);
    lsSet('listsSeeded', true);
    await Sync.pull(true);
    return true;
  },
  async initUpload() {
    // 1) What is in the cloud now (keys and timestamps only)
    const cloud = new Map(); let from = 0;
    for (; ;) {
      const { data } = await Sync.q(Sync.client.from('records').select('store,id,updated_at,deleted').eq('user_id', Sync.user.id).order('store').order('id').range(from, from + SYNC_PAGE - 1));
      (data || []).forEach(r => cloud.set(r.store + '|' + r.id, r));
      if (!data || data.length < SYNC_PAGE) break;
      from += SYNC_PAGE;
    }
    // 2) Make every local record newer than its cloud copy, so the upload wins
    const restamp = {}, localKeys = new Set(['meta|settings']);
    STORES.forEach(s => {
      if (s === 'meta') return;
      S.data[s].forEach(r => {
        localKeys.add(s + '|' + r.id);
        const cr = cloud.get(s + '|' + r.id);
        if (cr && Number(cr.updated_at) >= (Number(r.updatedAt) || 0)) { r.updatedAt = Number(cr.updated_at) + 1; (restamp[s] = restamp[s] || []).push(r); }
      });
    });
    await Promise.all(Object.entries(restamp).map(([s, a]) => DB.putMany(s, a)));
    const cs = cloud.get('meta|settings');
    S.settings.updatedAt = Math.max(nextTs(S.settings.updatedAt), cs ? Number(cs.updated_at) + 1 : 0);
    Sync.settingsBaseline(); await DB.put('meta', S.settings);
    // 3) Tombstones for cloud items this device doesn't have
    const dels = [];
    cloud.forEach((cr, k) => { if (!cr.deleted && !localKeys.has(k) && STORES.includes(cr.store)) dels.push({ key: k, store: cr.store, id: cr.id, op: 'del', ts: Math.max(Date.now(), Number(cr.updated_at) + 1), seq: Sync.nextSeq() }); });
    await Sync.enqueueAll();
    if (dels.length) await DB.putMany('outbox', dels);
    await Sync.push();
    await Sync.pull(true);   // sets the cursor; our own rows come back as no-ops
    return Object.keys(restamp).length > 0;
  },

  /* ---------- the sync cycle ---------- */
  ready() { return !!(Sync.client && Sync.user); },
  schedule(ms = 2000) {   // debounced sync after local edits
    if (!Sync.ready() || !Sync.cfg().auto) return;
    clearTimeout(Sync.debounceTimer); Sync.debounceTimer = setTimeout(() => Sync.run('edit'), ms);
  },
  request(reason) { Sync.run(reason, true); },
  whenIdle() { return Sync.busy ? new Promise(r => Sync.idleWaiters.push(r)) : Promise.resolve(); },
  async run(reason, manual) {
    if (!Sync.ready()) { if (manual) toast(Sync.configured() ? 'Sign in to sync.' : 'Set up cloud sync in Settings first.', 'warn'); return; }
    if (!navigator.onLine) { Sync.setState('offline'); if (manual) toast("You're offline. Changes are kept on this device and sync when you reconnect.", 'warn'); return; }
    if (!DB.db) { Sync.setState('error', 'browser storage is unavailable'); return; }
    if (Sync.busy) { Sync.again = true; return; }
    Sync.busy = true; Sync.lastRun = Date.now();
    clearTimeout(Sync.retryTimer); clearTimeout(Sync.debounceTimer);
    let changed = false;
    try {
      if (!lsGet(Sync.uidKey('init'), false)) {
        const r = await Sync.firstSync();
        if (r === 'cancel') { Sync.setState('choose'); toast('Sync is paused until you choose how to combine this device with the cloud.', 'info'); return; }
        changed = r;
      } else {
        Sync.setState('syncing');
        changed = await Sync.pull();
        if (await Sync.push()) changed = true;
      }
      Sync.failures = 0; Sync.lastToast = '';
      Sync.lastAt = Date.now(); lsSet(Sync.uidKey('lastAt'), Sync.lastAt);
      Sync.setState('synced');
      if (manual) toast('Sync complete');
    } catch (e) {
      Sync.fail(e, manual);
    } finally {
      Sync.busy = false;
      if (changed) Sync.refreshUI();
      Sync.updatePending();
      Sync.idleWaiters.splice(0).forEach(r => r());
      if (Sync.again) { Sync.again = false; setTimeout(() => Sync.run('again'), 300); }
    }
  },
  errorKind(e) {
    const code = String((e && e.code) || ''), status = e && e.status, m = String((e && (e.message || e)) || '');
    if (code === '42501' || /row-level security|permission denied/i.test(m)) return 'rls';
    if (code === '42P01' || code === 'PGRST205' || code === 'PGRST204' || /does not exist|could not find the table|schema cache/i.test(m)) return 'setup';
    if (status === 401 || code.startsWith('PGRST30') || /jwt|not authenticated|invalid api key|no api key|session/i.test(m)) return 'auth';
    if (e instanceof TypeError || status === 0 || /failed to fetch|networkerror|network request failed|load failed|fetch/i.test(m)) return 'network';
    return 'other';
  },
  describeError(e) {
    switch (Sync.errorKind(e)) {
      case 'rls': return 'permission denied by Row Level Security (check that supabase.sql ran, then sign in again)';
      case 'setup': return "the cloud table isn't set up (run supabase.sql in the Supabase SQL Editor)";
      case 'auth': return 'your session expired or the key is wrong (sign in again)';
      case 'network': return "can't reach Supabase (connection problem, or the project is paused)";
      default: return String((e && e.message) || e || 'unknown error').slice(0, 160);
    }
  },
  fail(e, manual) {
    console.error('[sync]', e);
    const kind = Sync.errorKind(e), msg = Sync.describeError(e);
    if (kind === 'network' && !navigator.onLine) Sync.setState('offline');
    else Sync.setState('error', msg);
    if (manual || msg !== Sync.lastToast) { toast(`Sync failed: ${msg}. Your data is safe on this device.`, 'bad'); Sync.lastToast = msg; }
    // Retry with exponential backoff (5 s → 5 min). Setup, RLS and auth problems need the user, so don't hammer.
    if (kind === 'network' || kind === 'other') {
      Sync.failures++;
      const delay = Math.min(300000, 5000 * 2 ** (Sync.failures - 1)) * (0.8 + Math.random() * 0.4);
      clearTimeout(Sync.retryTimer);
      Sync.retryTimer = setTimeout(() => { if (Sync.cfg().auto || manual) Sync.run('retry'); }, delay);
    }
  },
  // Re-render once after remote changes, but not while the user is typing in the page.
  refreshUI() {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#content') && a.matches('input, textarea, select, [contenteditable]')) { Sync.deferredRefresh = true; return; }
    Sync.deferredRefresh = false; refresh(); renderBell();
  },

  /* ---------- connection & auth ---------- */
  loadLib() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve(true);
    if (Sync.libPromise) return Sync.libPromise;
    Sync.libPromise = new Promise(res => {
      const s = document.createElement('script');
      s.src = SUPABASE_JS.src; s.integrity = SUPABASE_JS.integrity; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
      s.onload = () => res(!!(window.supabase && window.supabase.createClient));
      s.onerror = () => { Sync.libPromise = null; s.remove(); res(false); };
      document.head.appendChild(s);
    });
    return Sync.libPromise;
  },
  async init() {
    Sync.wire();
    Sync.updatePending();
    if (!Sync.configured()) { Sync.setState('nocfg'); return; }
    await Sync.connect();
  },
  teardown() {
    Sync.stopPoll(); clearTimeout(Sync.retryTimer); clearTimeout(Sync.debounceTimer);
    if (Sync.client) { try { Sync.client.auth.stopAutoRefresh(); Sync.client.removeAllChannels(); } catch { } }
    Sync.client = null; Sync.user = null;
  },
  async connect() {
    Sync.teardown();
    if (!Sync.configured()) { Sync.setState('nocfg'); return; }
    Sync.setState('signedout');
    const c = Sync.cfg();
    if (!(await Sync.loadLib())) { Sync.setState(navigator.onLine ? 'error' : 'offline', navigator.onLine ? 'could not load the Supabase library from jsDelivr' : ''); return; }
    let client;
    try {
      client = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce', storageKey: SYNC_AUTH_KEY } });
    } catch (e) { Sync.setState('error', 'invalid project URL or key'); return; }
    Sync.client = client;
    client.auth.onAuthStateChange((event, session) => {
      if (client !== Sync.client) return;
      setTimeout(() => Sync.onSession(event, session), 0);   // don't call Supabase from inside this callback
    });
  },
  onSession(event, session) {
    const prev = Sync.user && Sync.user.id;
    Sync.user = session ? session.user : null;
    if (!Sync.user) {
      Sync.stopPoll();
      Sync.setState(Sync.configured() ? 'signedout' : 'nocfg');
      if (prev && S.route === 'prefs') refresh();
      return;
    }
    if (prev === Sync.user.id) return;   // token refresh etc.
    Sync.lastAt = lsGet(Sync.uidKey('lastAt'), null);
    Sync.setState('synced');   // shows "Signed in" until the first sync finishes
    if (S.route === 'prefs') refresh();
    Sync.startPoll();
    if (event === 'SIGNED_IN' || Sync.cfg().auto) Sync.run(event === 'SIGNED_IN' ? 'signin' : 'start');
  },
  redirectUrl() { return location.origin + location.pathname; },
  async signIn(email, password) { const { error } = await Sync.client.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async signUp(email, password) { const { data, error } = await Sync.client.auth.signUp({ email, password, options: { emailRedirectTo: Sync.redirectUrl() } }); if (error) throw error; return !!data.session; },
  async magicLink(email) { const { error } = await Sync.client.auth.signInWithOtp({ email, options: { emailRedirectTo: Sync.redirectUrl() } }); if (error) throw error; },
  async signOut({ quiet } = {}) {
    await Sync.whenIdle();
    if (Sync.client) { try { await Sync.client.auth.signOut({ scope: 'local' }); } catch (e) { console.error(e); } }
    Sync.user = null; Sync.stopPoll();
    Sync.setState(Sync.configured() ? 'signedout' : 'nocfg');
    if (!quiet) toast('Signed out. Your data stays on this device.');
  },
  async eraseCloud() {
    if (!Sync.ready()) throw new Error('not signed in');
    if (!navigator.onLine) throw new TypeError('Failed to fetch');
    const now = Date.now();
    await Sync.q(Sync.client.from('records').update({ deleted: true, data: {}, updated_at: now }).eq('user_id', Sync.user.id).eq('deleted', false).lte('updated_at', now));
  },
  async setDemo(on) {
    Sync.setCfg({ demo: on });
    if (on) {   // queue the demo records that were held back
      for (const s of STORES) { if (s === 'meta') continue; for (const r of S.data[s]) if (r.demo || (s === 'lists' && (r.items || []).some(i => i && i.demo))) await DB.put('outbox', Sync.entry(s, r.id, 'put')); }
      Sync.updatePending(); Sync.schedule(300);
    }
  },

  /* ---------- timers & events ---------- */
  startPoll() {
    Sync.stopPoll();
    Sync.pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && Sync.ready() && Sync.cfg().auto) Sync.run('poll'); }, SYNC_POLL_MS);
  },
  stopPoll() { clearInterval(Sync.pollTimer); Sync.pollTimer = null; },
  wire() {
    if (Sync.wired) return; Sync.wired = true;
    window.addEventListener('online', () => {
      if (!Sync.configured()) return;
      if (!Sync.client) { Sync.connect(); return; }
      if (Sync.ready() && Sync.cfg().auto) Sync.run('online');
      else if (Sync.state === 'offline') Sync.setState(Sync.ready() ? 'synced' : 'signedout');
    });
    window.addEventListener('offline', () => { if (Sync.configured()) Sync.setState('offline'); });

    }, 60));

  },

  /* ---------- status UI ---------- */
  setState(st, msg = '') { Sync.state = st; Sync.error = msg; Sync.paint(); },
  statusText() {
    switch (Sync.state) {
      case 'nocfg': return 'Not configured';
      case 'signedout': return 'Signed out';
      case 'syncing': return 'Syncing…';
      case 'synced': return Sync.lastAt ? `Synced at ${new Date(Sync.lastAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'Signed in';
      case 'offline': return 'Offline';
      case 'choose': return 'Action needed: choose how to sync';
      case 'error': return `Error: ${Sync.error}`;
      default: return '';
    }
  },
  paint() {
    const st = Sync.state, txt = Sync.statusText();
    const ind = $('#sync-ind');
    if (ind) {
      ind.hidden = st === 'nocfg' || st === 'off';
      ind.dataset.st = st; ind.title = 'Cloud sync: ' + txt;
      ind.querySelector('.lbl').textContent = { synced: 'Synced', syncing: 'Syncing…', offline: 'Offline', error: 'Sync error', choose: 'Sync paused', signedout: 'Signed out' }[st] || 'Sync';
      ind.querySelector('svg').outerHTML = ic(st === 'offline' || st === 'error' ? 'cloudOff' : 'cloud');
    }
    const pill = $('#sync-status');
    if (pill) { pill.className = 'pill ' + ({ synced: 'good', syncing: 'info', offline: 'warn', choose: 'warn', error: 'bad' }[st] || ''); pill.innerHTML = '<span class="dot"></span>'; pill.append(txt); }
    const pend = $('#sync-pending');
    if (pend) pend.textContent = Sync.pendingCount && st !== 'nocfg' ? `${Sync.pendingCount} change${Sync.pendingCount === 1 ? '' : 's'} waiting to upload` : '';
    const ch = $('[data-sync-choose]'); if (ch) ch.style.display = st === 'choose' ? '' : 'none';
  },
  renderSettings(box) {
    if (!box) return;
    const c = Sync.cfg(), u = Sync.user;
    const authBlock = !Sync.configured() ? '' : u ? `
      <div class="stack" style="gap:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div class="row"><div style="flex:1;min-width:200px">Signed in as <b id="sync-email"></b></div><button class="btn sm" data-sync-out>Sign out</button></div>
        <div class="row"><button class="btn primary sm" data-sync-now>${ic('refresh')} Sync now</button><button class="btn sm" data-sync-choose style="display:none">Choose how to sync…</button></div>
        <label class="row nowrap" style="gap:10px"><button class="switch ${c.auto ? 'on' : ''}" data-sync-auto aria-label="Auto-sync"></button><span>Auto-sync <span class="muted" style="font-size:12.5px">on start, every minute while open, when back online and shortly after each change</span></span></label>
        <label class="row nowrap" style="gap:10px"><button class="switch ${c.demo ? 'on' : ''}" data-sync-demo aria-label="Upload demo data"></button><span>Upload demo data <span class="muted" style="font-size:12.5px">off by default: sample records stay on this device</span></span></label>
      </div>` : `
      <form class="stack" data-sync-auth style="gap:12px;max-width:640px;padding-top:12px;border-top:1px solid var(--border)" novalidate>
        <div class="sync-grid">
          <div class="field"><label for="sy-email">Email</label><input class="input" id="sy-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
          <div class="field"><label for="sy-pass">Password</label><input class="input" id="sy-pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
        </div>
        <div class="row"><button class="btn primary sm" type="submit">Sign in</button><button class="btn sm" type="button" data-sync-signup>Create account</button><button class="btn sm ghost" type="button" data-sync-magic>Email me a magic link</button></div>
        <div class="errmsg" id="sy-err" hidden></div>
      </form>`;
    box.innerHTML = `
      <div class="row"><span class="pill" id="sync-status"></span><span class="muted" id="sync-pending" style="font-size:12.5px"></span></div>
      <form class="stack" data-sync-cfg style="gap:12px;max-width:640px" novalidate>
        <div class="sync-grid">
          <div class="field"><label for="sy-url">Project URL</label><input class="input" id="sy-url" placeholder="https://abcd1234.supabase.co" value="${esc(c.url)}" autocomplete="off" spellcheck="false"></div>
          <div class="field"><label for="sy-key">Anon / publishable key</label><input class="input" id="sy-key" type="password" placeholder="sb_publishable_… or eyJ…" value="${esc(c.key)}" autocomplete="off" spellcheck="false"></div>
        </div>
        <div class="hint">Find both in Supabase under Project Settings → API (or Data API and API Keys). Use the public <b>anon</b> or <b>publishable</b> key only, never the service_role or secret key. They're saved in this browser only and are never synced.</div>
        <div class="row"><button class="btn sm" type="submit">${Sync.configured() ? 'Save and reconnect' : 'Connect'}</button>${Sync.configured() ? '<button class="btn sm ghost" type="button" data-sync-forget>Disconnect</button>' : ''}</div>
      </form>${authBlock}`;
    const em = $('#sync-email', box); if (em) em.textContent = u.email || '';
    Sync.paint();
    // Connection settings
    box.querySelector('[data-sync-cfg]').onsubmit = async e => {
      e.preventDefault();
      const url = $('#sy-url', box).value.trim().replace(/\/+$/, ''), key = $('#sy-key', box).value.trim();
      if (!/^https:\/\/[^\s/]+$/i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(url)) return toast('Enter your project URL, e.g. https://abcd1234.supabase.co', 'warn');
      if (!key) return toast('Paste your anon / publishable key.', 'warn');
      if (Sync.isSecretKey(key)) return toast("That's a secret (service_role) key. Never put it in a web page. Use the anon / publishable key.", 'bad');
      const old = Sync.cfg();
      if (old.url !== url) { if (Sync.user) await Sync.signOut({ quiet: true }); Sync.clearSession(); }
      Sync.setCfg({ url, key });
      await Sync.connect(); refresh();
      toast('Connection saved');
    };
    const fg = box.querySelector('[data-sync-forget]');
    if (fg) fg.onclick = async () => {
      if (!(await confirmBox({ title: 'Disconnect cloud sync?', message: 'This device stops syncing and forgets the project URL and key. Your data stays on this device and in the cloud.', okText: 'Disconnect', danger: false }))) return;
      if (Sync.user) await Sync.signOut({ quiet: true });
      Sync.teardown(); Sync.clearSession(); Sync.setCfg({ url: '', key: '' }); Sync.setState('nocfg'); refresh();
      toast('Cloud sync disconnected');
    };
    // Auth
    const af = box.querySelector('[data-sync-auth]');
    if (af) {
      const err = $('#sy-err', box);
      const creds = (needPass = true) => {
        const email = $('#sy-email', box).value.trim(), pass = $('#sy-pass', box).value;
        err.hidden = true;
        if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'Enter a valid email address.'; err.hidden = false; return null; }
        if (needPass && pass.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.hidden = false; return null; }
        return { email, pass };
      };
      const busy = async fn => {
        if (!Sync.client) { err.textContent = Sync.state === 'offline' ? "You're offline." : 'Not connected to Supabase yet. Check the URL and key.'; err.hidden = false; return; }
        af.querySelectorAll('button').forEach(b => b.disabled = true);
        try { await fn(); } catch (e) { err.textContent = Sync.authMessage(e); err.hidden = false; }
        finally { af.querySelectorAll('button').forEach(b => b.disabled = false); }
      };
      af.onsubmit = e => { e.preventDefault(); const c2 = creds(); if (c2) busy(async () => { await Sync.signIn(c2.email, c2.pass); toast('Signed in'); }); };
      af.querySelector('[data-sync-signup]').onclick = () => { const c2 = creds(); if (c2) busy(async () => { const live = await Sync.signUp(c2.email, c2.pass); toast(live ? 'Account created and signed in' : 'Check your email to confirm your account, then sign in.', live ? 'good' : 'info'); }); };
      af.querySelector('[data-sync-magic]').onclick = () => { const c2 = creds(false); if (c2) busy(async () => { await Sync.magicLink(c2.email); toast('Magic link sent. Open it in this browser to sign in.', 'info'); }); };
    }
    const out = box.querySelector('[data-sync-out]'); if (out) out.onclick = async () => { await Sync.signOut(); refresh(); };
    const now = box.querySelector('[data-sync-now]'); if (now) now.onclick = () => Sync.request('manual');
    const ch = box.querySelector('[data-sync-choose]'); if (ch) ch.onclick = () => Sync.request('choose');
    const au = box.querySelector('[data-sync-auto]'); if (au) au.onclick = () => { const on = !Sync.cfg().auto; Sync.setCfg({ auto: on }); au.classList.toggle('on', on); if (on) Sync.run('auto-on'); };
    const dm = box.querySelector('[data-sync-demo]'); if (dm) dm.onclick = async () => { const on = !Sync.cfg().demo; dm.classList.toggle('on', on); await Sync.setDemo(on); toast(on ? 'Demo data will be uploaded' : 'New demo data stays on this device. Demo data already uploaded stays in the cloud until you remove it.', 'info'); };
  },
  isSecretKey(key) {
    if (/^sb_secret_/i.test(key)) return true;
    try { const p = JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.role === 'service_role'; } catch { return false; }
  },
  authMessage(e) {
    const m = String((e && e.message) || e || '');
    if (Sync.errorKind(e) === 'network') return "Can't reach Supabase. Check your connection and the project URL.";
    if (/invalid login credentials/i.test(m)) return 'Wrong email or password.';
    if (/email not confirmed/i.test(m)) return 'Confirm your email first (check your inbox), then sign in.';
    if (/already registered|already exists/i.test(m)) return 'An account with this email already exists. Sign in instead.';
    if (/invalid api key|no api key/i.test(m)) return 'The anon / publishable key is not valid for this project.';
    return m || 'Something went wrong.';
  },
};

/* ============================================================
   PWA: service worker registration, install prompt, update notice
   ------------------------------------------------------------
   Needs sw.js, manifest.webmanifest and /icons next to this file, served
   over https (or localhost). Opened any other way (file://, or with the
   files missing), the app runs exactly as a normal page.
   ============================================================ */
const PWA = {
  deferred: null, reg: null, reloading: false, wired: false,
  isStandalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  supported() { return 'serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol); },
  init() {
    if (PWA.wired) return; PWA.wired = true;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.deferred = e; PWA.paint(); });
    window.addEventListener('appinstalled', () => { PWA.deferred = null; PWA.paint(); toast('My Life OS is installed'); });
    matchMedia('(display-mode: standalone)').addEventListener?.('change', () => PWA.paint());
    PWA.themeColor();
    if (!PWA.supported()) return;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // A new version took over. Don't reload by itself (you might be typing): offer it.
      if (hadController && !PWA.reloading) toast('A new version of My Life OS is ready.', 'info', { label: 'Reload', fn: () => { PWA.reloading = true; location.reload(); } });
      PWA.paint();
    });
    const register = () => navigator.serviceWorker.register('sw.js').then(r => {
      PWA.reg = r; PWA.paint();
      setInterval(() => r.update().catch(() => { }), 60 * 60 * 1000);   // look for a new version hourly
    }).catch(e => console.warn('[pwa] service worker not registered:', e && e.message));
    if (document.readyState === 'complete') register(); else window.addEventListener('load', register);
  },
  async install() {
    if (!PWA.deferred) return;
    PWA.deferred.prompt();
    try { await PWA.deferred.userChoice; } catch { }
    PWA.deferred = null; PWA.paint();
  },
  // Keep the browser/OS title bar colour in step with the app's light/dark theme
  themeColor() {
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if (bg) document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', bg));
  },
  paint() { const b = $('#pwa-body'); if (b) PWA.renderSettings(b); },
  renderSettings(box) {
    if (!box) return;
    const offline = PWA.supported() && !!navigator.serviceWorker.controller;
    let html;
    if (PWA.isStandalone()) html = `<div class="row"><span class="pill good"><span class="dot"></span>Installed</span><span class="muted" style="font-size:12.5px">You're using the installed app.</span></div>`;
    else if (PWA.deferred) html = `<div class="row"><button class="btn primary sm" data-pwa-install>${ic('download')} Install My Life OS</button></div>`;
    else if (PWA.isIOS()) html = `<p class="muted" style="font-size:13px">On iPhone or iPad: open this page in <b>Safari</b>, tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>`;
    else if (!PWA.supported()) html = `<p class="muted" style="font-size:13px">Installing needs the app to be hosted on <b>https</b> with its <code>sw.js</code>, <code>manifest.webmanifest</code> and <code>icons</code> files (see SETUP.md). It still works normally as a page.</p>`;
    else html = `<p class="muted" style="font-size:13px">Use your browser's menu: <b>Install app</b> or <b>Add to Home screen</b> (Chrome, Edge, Samsung Internet). If you've already installed it, open it from your apps.</p>`;
    html += `<div class="row" style="font-size:12.5px"><span class="pill ${offline ? 'good' : ''}"><span class="dot"></span>${offline ? 'Ready to work offline' : 'Offline mode not active yet'}</span></div>`;
    box.innerHTML = html;
    const b = box.querySelector('[data-pwa-install]'); if (b) b.onclick = () => PWA.install();
  },
};

function go(r) { if (location.hash.slice(1) !== r) location.hash = r; else render(); }
function currentRoute() { const h = location.hash.slice(1); return VIEWS[h] ? h : 'home'; }
function render(keepScroll) {
  const r = currentRoute(), changed = r !== S.route; S.route = r;
  const y = window.scrollY;

  if (changed) { el.style.animation = 'none'; el.offsetHeight; el.style.animation = ''; }
  try { VIEWS[r].render(el); } catch (e) { console.error(e); el.innerHTML = `<div class="card">${empty('alert', 'Something went wrong on this page', String(e.message || e), '<button class="btn" onclick="location.hash=\'home\'">Back to dashboard</button>')}</div>`; }
  $('#page-title').textContent = VIEWS[r].title;
  document.title = VIEWS[r].title === 'Dashboard' ? 'My Life OS' : `${VIEWS[r].title} · My Life OS`;
  $$('[data-route]').forEach(a => a.classList.toggle('active', a.dataset.route === r));
  updateBadges();
  if (keepScroll && !changed) window.scrollTo(0, y); else if (changed) window.scrollTo(0, 0);
  refreshHooks.slice().forEach(h => { try { h(); } catch (e) { console.error(e); } });
}
const refresh = () => render(true);
function updateBadges() {

/* ---------- Global search ---------- */
function searchAll(q) {
  q = q.toLowerCase().trim(); if (!q) return [];
  const has = (...v) => v.join(' ').toLowerCase().includes(q);
  const out = [];
  const add = (group, icon, title, sub, fn) => out.push({ group, icon, title, sub, fn });
  S.data.tasks.filter(t => has(t.title, t.desc, (t.tags || []).join(' '), t.category)).slice(0, 6).forEach(t => add('Tasks', 'tasks', t.title, `${t.status}${t.due ? ' · due ' + D.rel(t.due) : ''}`, () => openTask(t)));
  S.data.notes.filter(n => has(n.title, n.body, (n.tags || []).join(' '))).slice(0, 6).forEach(n => add('Notes', 'note', n.title || 'Untitled', stripMd(n.body).slice(0, 60), () => { setUI('noteSel', n.id); setUI('noteFolder', 'all'); go('notes'); }));
  S.data.tx.filter(t => has(t.desc, t.note, t.category, String(t.amount))).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6).forEach(t => add('Transactions', t.type, t.desc || t.category, `${t.type === 'income' ? '+' : '−'}${money(t.amount)} · ${D.fmt(t.date)}`, () => openTx(t)));
  S.data.goals.filter(g => has(g.title, g.desc)).slice(0, 4).forEach(g => add('Goals', 'target', g.title, `${G.progress(g)}% · ${g.category}`, () => goalDetail(g)));
  S.data.habits.filter(h => has(h.name)).slice(0, 4).forEach(h => add('Habits', 'flame', h.name, `${H.streak(h)} streak`, () => go('habits')));
  S.data.events.filter(e => has(e.title, e.note, e.location)).slice(0, 4).forEach(e => add('Events', 'calendar', e.title, D.fmt(e.date) + (e.recur !== 'none' ? ' · repeats ' + e.recur : ''), () => openEvent(e)));
  S.data.journal.filter(j => has(j.body)).slice(0, 4).forEach(j => add('Journal', 'book', D.fmt(j.id), (j.body || '').slice(0, 60), () => { setUI('jDate', j.id); setUI('jMonth', D.ym(j.id)); go('journal'); }));
  S.data.lists.forEach(l => (l.items || []).filter(it => has(...Object.values(it).map(String))).slice(0, 3).forEach(it => { const K = LIST_KINDS[l.kind] || LIST_KINDS.custom; add('Records', K.icon, it[K.title] || 'Item', l.name, () => { setUI('listSel', l.id); go('records'); setTimeout(() => openListItem(byId('lists', l.id), it), 50); }); }));
  S.data.debts.filter(d => has(d.person, d.note)).slice(0, 3).forEach(d => add('Money owed', 'swap', d.person, money(d.amount) + (d.settled ? ' · settled' : ''), () => openDebt(d)));
  return out;
}
function wireSearch() {
  const inp = $('#gsearch'), box = $('#gresults'); let sel = 0, res = [];
  const draw = () => {
    res = searchAll(inp.value);
    if (!inp.value.trim()) { box.hidden = true; return; }
    box.hidden = false; sel = Math.min(sel, Math.max(0, res.length - 1));
    let lastG = '';
    box.innerHTML = res.length ? res.map((r, i) => { const g = r.group !== lastG ? `<div class="sr-group">${r.group}</div>` : ''; lastG = r.group; return `${g}<div class="sr-item ${i === sel ? 'sel' : ''}" data-i="${i}">${ic(r.icon)}<div style="min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</div><div class="sub">${esc(r.sub || '')}</div></div></div>`; }).join('') : `<div class="empty" style="padding:20px">${ic('search')}<b>No results for “${esc(inp.value)}”</b></div>`;
    box.querySelectorAll('[data-i]').forEach(x => x.onmousedown = e => { e.preventDefault(); pickRes(+x.dataset.i); });
  };
  const pickRes = i => { const r = res[i]; if (!r) return; inp.value = ''; box.hidden = true; inp.blur(); r.fn(); };
  inp.oninput = () => { sel = 0; draw(); };
  inp.onfocus = draw;
  inp.onblur = () => setTimeout(() => box.hidden = true, 120);
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(res.length - 1, sel + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); pickRes(sel); }
    else if (e.key === 'Escape') { inp.value = ''; box.hidden = true; inp.blur(); }
  };
}

/* ---------- Notifications panel ---------- */
function renderBell() {
  const btn = $('#bell'); if (!btn) return;
  const al = computeAlerts(), n = S.notifs.length + al.filter(a => a.lvl === 'bad').length;
  btn.querySelector('.notif-dot') && btn.querySelector('.notif-dot').remove();
  if (n) btn.insertAdjacentHTML('beforeend', '<span class="notif-dot"></span>');
  const p = $('#notif'); if (p.hidden) return;
  p.innerHTML = `<div class="row" style="padding:8px 10px"><b style="flex:1">Notifications</b>${S.notifs.length ? '<button class="btn ghost sm" data-clearn>Clear</button>' : ''}</div>
    ${S.notifs.length ? `<div class="sr-group">Reminders</div>${S.notifs.map((r, i) => `<div class="sr-item" data-nr="${i}">${ic('bell')}<div><div>${esc(r.title)}</div><div class="sub">${esc(r.body)} · ${new Date(r.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div></div></div>`).join('')}` : ''}
    <div class="sr-group">Needs attention</div>${al.length ? al.map((a, i) => `<div class="sr-item alert-row ${a.lvl}" data-na="${i}">${ic(a.icon)}<div><div>${esc(a.text)}</div><div class="sub">${esc(a.sub || '')}</div></div></div>`).join('') : '<p class="muted" style="padding:6px 10px 12px;font-size:13px">All clear.</p>'}
    <p class="faint" style="padding:8px 10px;font-size:11.5px;border-top:1px solid var(--border)">Reminders fire while this app is open.</p>`;
  p.querySelectorAll('[data-na]').forEach(x => x.onclick = () => { p.hidden = true; al[+x.dataset.na].go(); });
  p.querySelectorAll('[data-nr]').forEach(x => x.onclick = () => { p.hidden = true; go(S.notifs[+x.dataset.nr].route); });
  const c = p.querySelector('[data-clearn]'); if (c) c.onclick = () => { S.notifs = []; renderBell(); };
}

/* ---------- Wiring ---------- */
function wireShell() {
  const app = $('#app');
  $('#collapse').onclick = async () => { S.settings.sidebarCollapsed = !S.settings.sidebarCollapsed; applyShell(); await saveSettings(); setTimeout(() => S.charts.forEach(c => c.resize()), 260); };
  $('#menu').onclick = () => app.classList.add('nav-open');
  $('#scrim').onclick = () => app.classList.remove('nav-open');
  $$('.sidebar a').forEach(a => a.addEventListener('click', () => app.classList.remove('nav-open')));
  $('#theme-btn').onclick = async () => { S.settings.theme = effectiveDark() ? 'light' : 'dark'; applyTheme(); await saveSettings(); render(true); };
  $('#bell').onclick = e => { e.stopPropagation(); const p = $('#notif'); p.hidden = !p.hidden; renderBell(); };
  const fab = $('#fab');
  $('#fab-btn').onclick = e => { e.stopPropagation(); fab.classList.toggle('open'); };
  $$('[data-quick]').forEach(b => b.onclick = () => { fab.classList.remove('open'); QUICK.find(q => q.id === b.dataset.quick).fn(); });
  document.addEventListener('click', e => { if (!e.target.closest('#fab')) fab.classList.remove('open'); if (!e.target.closest('#notif') && !e.target.closest('#bell')) $('#notif').hidden = true; });
  let gPending = 0;
  document.addEventListener('keydown', e => {
    const typing = e.target.closest('input, textarea, select, [contenteditable]');
    if (e.key === 'Escape') { if (modalStack.length) { modalStack[modalStack.length - 1].close(); return; } fab.classList.remove('open'); $('#notif').hidden = true; app.classList.remove('nav-open'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#gsearch').focus(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || modalStack.length) return;
    const k = e.key.toLowerCase();
    if (fab.classList.contains('open')) { const q = QUICK.find(x => x.key.toLowerCase() === k); if (q) { e.preventDefault(); fab.classList.remove('open'); q.fn(); return; } }
    if (gPending && Date.now() - gPending < 1200) { const m = { d: 'home', f: 'finance', t: 'tasks', h: 'habits', g: 'goals', n: 'notes', j: 'journal', c: 'calendar', r: 'records', a: 'analytics', s: 'prefs' }[k]; gPending = 0; if (m) { e.preventDefault(); go(m); return; } }
    if (k === '/') { e.preventDefault(); $('#gsearch').focus(); }
    else if (k === 'n') { e.preventDefault(); fab.classList.add('open'); }
    else if (k === 'g') gPending = Date.now();
  });
  window.addEventListener('hashchange', () => render());
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'system') { applyTheme(); render(true); } });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.route === 'records') render(true); }, 250); });
}

async function boot() {
  VIEWER_THEME = document.documentElement.getAttribute('data-theme');
  document.body.insertAdjacentHTML('afterbegin', shellHTML());
  wireShell(); wireSearch();
  const ok = await DB.open();
  if (ok) { try { await loadAll(); } catch (e) { console.error(e); } }
  await ensureDefaultLists();
  applyTheme(); applyShell();
  if (!ok) toast("Browser storage is unavailable here. Changes won't be kept after you close this tab.", 'bad');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { }
  render();
  renderBell();
  getDL();
  setInterval(tickClock, 1000);
  let lastDay = D.today();
  setInterval(() => { checkReminders(); if (D.today() !== lastDay) { lastDay = D.today(); render(true); } renderBell(); }, 30000);
  setTimeout(checkReminders, 1500);
  Sync.init();   // no-op unless cloud sync has been configured in Settings
  PWA.init();    // service worker + install prompt (only on https or localhost)
}
boot();

</script>
